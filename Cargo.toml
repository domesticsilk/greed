[package]
name = "greed"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A minimal, advanced download manager for Linux (GUI + CLI) powered by aria2"
license = "GPL-2.0-only"
repository = "https://github.com/thefool/greed"
homepage = "https://github.com/thefool/greed"
documentation = "https://github.com/thefool/greed#readme"
readme = "README.md"
keywords = ["download-manager", "aria2", "egui", "linux", "rust"]
categories = ["command-line-utilities", "gui"]
authors = ["TheFool <thefool@example.com>"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false }
ureq = { version = "3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pico-args = "0.5"
arboard = "3"
rfd = "0.15"
base64 = "0.22"
[dev-dependencies]
# (none yet)

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

# CI: release optimizations without fat LTO
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
incremental = false
debug = 0
panic = "unwind"

[[bin]]
name = "greed"
path = "src/main.rs"
