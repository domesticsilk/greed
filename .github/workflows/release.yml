name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the portable AppImage
        run: ./packaging/build-portable.sh
      - name: Write the SHA-256 file
        run: sha256sum build/Greed-x86_64.AppImage > build/Greed-x86_64.AppImage.sha256
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Greed-x86_64.AppImage \
            build/Greed-x86_64.AppImage.sha256 \
            --title "Greed $GITHUB_REF_NAME" \
            --generate-notes
